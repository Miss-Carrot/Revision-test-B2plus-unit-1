    let currentQuestions = [];

    // Fisher-Yates Shuffle Algorithm
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // Theme Switcher Toggle

    const themeIcon = document.getElementById('theme-icon');

    themeToggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      themeIcon.className = isDark ? 'fa-solid fa-sun text-amber-400 text-lg' : 'fa-solid fa-moon text-lg';
    });

    // Render Quiz Items

      currentQuestions = shuffleArray(rawQuestions);
      const container = document.getElementById('questions-list');

                     id="${inputId}" 
                     name="${inputName}" 
                     value="${opt.key}" 
                     class="mt-1 w-4 h-4 text-brand-600 border-slate-300 focus:ring-brand-500 dark:border-slate-600 dark:bg-slate-700 ${isMultiple ? 'rounded' : ''}">

          </div>

            ${q.prompt}
          </p>

    // Evaluation on Check Answers
    function checkAnswers() {
      let score = 0;

      currentQuestions.forEach((q, qIndex) => {
        const inputName = `question_${qIndex}`;
        const isMultiple = q.type === 'multiple';

        let selectedKeys = [];
        if (isMultiple) {
          const checkedInputs = document.querySelectorAll(`input[name="${inputName}"]:checked`);
          selectedKeys = Array.from(checkedInputs).map(el => el.value).sort();
        } else {
          const checkedInput = document.querySelector(`input[name="${inputName}"]:checked`);
          if (checkedInput) selectedKeys = [checkedInput.value];
        }

        const correctKeys = [...q.correct].sort();

        // Exact match comparison
        const isCorrect = selectedKeys.length === correctKeys.length && 
                          selectedKeys.every((val, idx) => val === correctKeys[idx]);

        if (isCorrect) {
          score++;
        }

        // Update status badge
        const statusEl = document.getElementById(`q-status-${qIndex}`);
        statusEl.classList.remove('hidden', 'text-emerald-600', 'text-red-500', 'dark:text-emerald-400', 'dark:text-red-400');

        if (isCorrect) {
          statusEl.className = 'text-sm font-semibold flex items-center gap-1 text-emerald-600 dark:text-emerald-400';
          statusEl.innerHTML = '<i class="fa-solid fa-circle-check"></i> Correct';
        } else {
          statusEl.className = 'text-sm font-semibold flex items-center gap-1 text-red-500 dark:text-red-400';
          statusEl.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Incorrect';
        }

        // Visual highlights for option labels
        q.options.forEach(opt => {
          const inputId = `q_${qIndex}_opt_${opt.key}`;
          const inputEl = document.getElementById(inputId);
          const labelEl = document.getElementById(`label_${inputId}`);
          if (!labelEl) return;

          if (inputEl) inputEl.disabled = true;
          labelEl.classList.add('cursor-not-allowed', 'opacity-90');

          labelEl.classList.remove('bg-emerald-50', 'border-emerald-500', 'dark:bg-emerald-950/40', 'bg-red-50', 'border-red-500', 'dark:bg-red-950/40');

          const isOptionCorrect = correctKeys.includes(opt.key);
          const isOptionSelected = selectedKeys.includes(opt.key);

          if (isOptionCorrect) {
            labelEl.classList.add('bg-emerald-50', 'border-emerald-500', 'dark:bg-emerald-950/40');
          } else if (isOptionSelected) {
            labelEl.classList.add('bg-red-50', 'border-red-500', 'dark:bg-red-950/40');
          }
        });

        // Explanation / Correct Answer key box
        const explanationEl = document.getElementById(`q-explanation-${qIndex}`);
        if (!isCorrect) {
          explanationEl.classList.remove('hidden');
          const correctText = correctKeys.join(', ');
          explanationEl.innerHTML = `<span class="font-semibold text-slate-700 dark:text-slate-200">Correct Answer:</span> <strong class="text-emerald-600 dark:text-emerald-400">${correctText}</strong>`;
        } else {
          explanationEl.classList.add('hidden');
        }
      });

      displayResults(score);
    }

    // Display Results with exact praise scale
    function displayResults(score) {
      const total = currentQuestions.length; // 30
      const fullText = praiseScaleExact[score] || "👍 Good effort!";
      
      const spaceIndex = fullText.indexOf(' ');
      const emoji = fullText.substring(0, spaceIndex);
      const textPhrase = fullText.substring(spaceIndex + 1);

      const resultCard = document.getElementById('result-card');
      document.getElementById('praise-emoji').textContent = emoji;
      document.getElementById('praise-text').textContent = textPhrase;
      
      const percentage = Math.round((score / total) * 100);
      document.getElementById('score-text').textContent = `You scored ${score} out of ${total} (${percentage}%)`;

      const scoreBar = document.getElementById('score-bar');
      resultCard.classList.remove('hidden');

      setTimeout(() => {
        scoreBar.style.width = `${percentage}%`;
      }, 100);

      resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // Restart Quiz
    function resetQuiz() {
      document.getElementById('result-card').classList.add('hidden');
      document.getElementById('score-bar').style.width = '0%';
      renderQuiz();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onload = function() {
      renderQuiz();
    };
  </script>
</body>
</html>
